<!DOCTYPE html>
<html lang = "es">
<head>
    <meta charset="UTF-8">
    <title>Registro Aviario</title>
    <link rel="stylesheet" href="css/estilos2.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<h1>Indicadores y Métricas</h1>
 
    <nav>
        <ul>
            <li><a href="index.html">Volver al inicio</a></li>
            <li><a href="registro_voluntarios.html">Registro de Voluntarios</a></li>
            <li><a href="registro_avistamientos.html">Registrar avistamientos</a></li>
            <li><a href="listado_avistamientos.html">Listado de avistamientos</a></li>
        </ul>
    </nav>
 
    <main>
        <section id="resumen-numerico">
            <article>
                <h2>Voluntarios registrados</h2>
                <p id="total-voluntarios" class="numero-destacado"></p>
            </article>
            <article>
                <h2>Avistamientos registrados</h2>
                <p id="total-avistamientos" class="numero-destacado"></p>
            </article>
        </section>
 
        <section id="graficos">
            <div class="contenedor-grafico">
                <h2>Avistamientos por tipo de ave</h2>
                <canvas id="grafico-tipos"></canvas>
            </div>
            <div class="contenedor-grafico">
                <h2>Voluntarios por región</h2>
                <canvas id="grafico-regiones"></canvas>
            </div>
        </section>
    </main>
 
<script src="js/datos-simulados.js"></script>
<script src="js/voluntarios-simulados.js"></script>
<script src="js/indicadores.js"></script>
 
</body>
</html>

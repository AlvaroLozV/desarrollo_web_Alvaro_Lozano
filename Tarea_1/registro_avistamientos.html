<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Avistamiento - Registro Aviario</title>
    <link rel="stylesheet" href="css/estilos2.css">
</head>
<body>
<h1>Registrar Avistamiento</h1>
<p>Cuéntanos qué ave viste, dónde y cuándo.</p>
 
    <nav>
        <ul>
            <li><a href="index.html">Volver al inicio</a></li>
            <li><a href="registro_voluntarios.html">Registro de Voluntarios</a></li>
            <li><a href="listado_avistamientos.html">Listado de avistamientos</a></li>
            <li><a href="indicadores.html">Métricas e indicadores</a></li>
        </ul>
    </nav>
 
    <main>
        <form id="form-avistamiento">
 
            <label for="tipo_ave">Tipo de ave: *</label>
            <select id="tipo_ave" name="tipo_ave" required>
                <option value="">-- Selecciona un tipo --</option>
                <option value="rapaz">Rapaz</option>
                <option value="acuatica">Acuática</option>
                <option value="paseriforme">Paseriforme</option>
                <option value="rasora">Rasora</option>
                <option value="marina">Marina</option>
            </select>
            <br>
 
            <label for="nombre_ave">Nombre del ave: *</label>
            <select id="nombre_ave" name="nombre_ave" required disabled>
                <option value="">-- Primero selecciona un tipo --</option>
            </select>
            <br>
 
            <label for="lugar">Lugar del avistamiento: *</label>
            <input type="text" id="lugar" name="lugar" minlength="3" maxlength="100"
                   placeholder="Ej: Parque Metropolitano, Santiago" required>
            <br>
 
            <label for="fecha_avistamiento">Fecha del avistamiento: *</label>
            <input type="date" id="fecha_avistamiento" name="fecha_avistamiento" required>
            <br>
 
            <label for="hora_avistamiento">Hora del avistamiento: *</label>
            <input type="time" id="hora_avistamiento" name="hora_avistamiento" required>
            <br>
 
            <label for="foto_avistamiento">Foto del avistamiento:</label>
            <input type="file" id="foto_avistamiento" name="foto_avistamiento" accept="image/*">
            <br>
 
            <label for="video_avistamiento">Video del avistamiento:</label>
            <input type="file" id="video_avistamiento" name="video_avistamiento" accept="video/*">
            <br>
            <p><em>Debes adjuntar al menos una foto o un video.</em></p>
            <span id="archivo-error" class="mensaje-error"></span>
            <br><br>
 
            <input type="submit" value="Registrar avistamiento">
        </form>
    </main>
 
<script src="js/tipos-ave.js"></script>
<script src="js/registro-avistamiento.js"></script>
 
</body>
</html>
